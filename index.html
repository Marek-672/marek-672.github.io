<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maya tools</title>
<style>
  :root { --bg:#161616; --text:#e8e4dc; --muted:#8c877e; --accent:#f08a24; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height:100%; display:flex; flex-direction:column; justify-content:center;
    align-items:center; text-align:center; padding:0 16px; box-sizing:border-box; }
  h1 { font-weight:600; font-size:clamp(28px,6vw,44px); margin:0 0 12px; letter-spacing:-0.01em; }
  p { color:var(--muted); margin:0; font-size:17px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%;
    background:var(--accent); margin-right:10px; vertical-align:middle; }
</style>
</head>
<body>
<main>
  <h1><span class="dot"></span>Maya tools</h1>
  <p>Made by an animator, for animators. Coming soon.</p>
</main>
</body>
</html>
